
spatial:
  min_lat: 35.75
  min_lon: -97.75
  max_lat: 39.75
  max_lon: -95.25
  spatial_name: "flinthills"

temporal:
  start_month: 2
  start_day: 15
  end_month: 5
  end_day: 15

paths: # relative to /fhba/app/
  raw_data_dir: "./appdata/raw"
  processed_data_dir: "./appdata/processed"
  truecolor_img_dir: "./appdata/truecolor_images"
  userpts_dir: "./appdata/userpts"
  burnmask_dir: "./appdata/burnmask"
  county_shp: "./appdata/_static/FH_Counties_Updated.shp/FH_Counties_Updated"
  nlcd_cache_dir: "./appdata/annual_nlcd"

nlcd:
  nlcd_filedir: "./appdata/annual_nlcd"
  nlcd_filename: "Annual_NLCD_LndCov_2024_CU_C1V1.tif"

viirs:
  full_band_list: ["I01","I02","I03","M03","M04","M05","M07","M08","M11"]
  # nir_red_band_list: index 0 = NIR (I02, 0.865 um), index 1 = RED (I01, 0.640 um)
  nir_red_band_list: ["I02","I01"]
  nbr_bands: ["I02","M11"]   # NIR=I02, SWIR=M11
  ndvi_bands: ["I02","I01"]  # NIR=I02, RED=I01
  Suomi-NPP:
    short_name_list: ["VNP02IMG", "VNP03IMG", "VNP02MOD", "VNP03MOD"]
    version: "002"
    cloud_mask_short_name: "CLDMSK_L2_VIIRS_SNPP"
    cloud_mask_version: "1"
    start_year: 2012
  NOAA-20:
    short_name_list: ["VJ102IMG", "VJ103IMG", "VJ102MOD", "VJ103MOD"]
    version: "002"
    cloud_mask_short_name: "CLDMSK_L2_VIIRS_NOAA20"
    cloud_mask_version: "1"
    start_year: 2018
  NOAA-21:
      short_name_list: ["VJ202IMG", "VJ203IMG", "VJ202MOD", "VJ203MOD"]
      version: "002"
      cloud_mask_short_name: "CLDMSK_L2_VIIRS_NOAA21"
      cloud_mask_version: "1"
      start_year: 2023

modis:
  full_band_list: ["1","2","3","4","7"]
  # nir_red_band_list: index 0 = NIR (band 2, 0.841-0.876 um), index 1 = RED (band 1, 0.620-0.670 um)
  nir_red_band_list: ["2","1"]
  nbr_bands: ["2","7"]   # NIR=band2, SWIR=band7
  ndvi_bands: ["2","1"]  # NIR=band2, RED=band1
  AQUA:
    short_name_list: ["MYD02QKM","MYD02HKM","MYD03","MYD09GA"]
    version: "061"
    cloud_mask_short_name: "MYD35_L2"
    cloud_mask_version: "061"
    start_year: 2002
  TERRA:
    short_name_list: ["MOD02QKM","MOD02HKM","MOD03","MOD09GA"]
    version: "061"
    cloud_mask_short_name: "MOD35_L2"
    cloud_mask_version: "061"
    start_year: 2000

landsat:
  full_band_list: ["B2","B3","B4","B5","B6","B7"]  # Blue, Green, Red, NIR, SWIR1, SWIR2
  # nir_red_band_list: index 0 = NIR (B5), index 1 = RED (B4)
  nir_red_band_list: ["B5","B4"]
  nbr_bands: ["B5","B7"]   # NIR=B5, SWIR2=B7
  ndvi_bands: ["B5","B4"]  # NIR=B5, RED=B4
  # Known Landsat orbital pass anchor dates for the Flint Hills study area.
  # Landsat repeats every 16 days per path; L8 and L9 are offset ~8 days,
  # giving combined ~8-day effective coverage.
  # Eastern Flint Hills paths (L8 and L9): anchor 2026-03-01 and 2026-03-09
  # Western Flint Hills paths (L8 and L9): anchor 2026-03-08 and 2026-03-16
  pass_anchor_dates:
    - "2026-03-01"   # eastern Flint Hills (satellite A)
    - "2026-03-08"   # western Flint Hills (satellite A)
    - "2026-03-09"   # eastern Flint Hills (satellite B, 8-day offset)
    - "2026-03-16"   # western Flint Hills (satellite B, 8-day offset)
  pass_repeat_days: 16
  Landsat-8:
    short_name_list: ["HLSL30"]
    version: "2.0"
    cloud_mask_short_name: "HLSL30"
    cloud_mask_version: "2.0"
    start_year: 2013
  Landsat-9:
    short_name_list: ["HLSL30"]
    version: "2.0"
    cloud_mask_short_name: "HLSL30"
    cloud_mask_version: "2.0"
    start_year: 2021

[project]
name = "fhba"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "needham-michael", email = "153653339+needham-michael@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bottleneck>=1.6.0",
    "cartopy>=0.25.0",
    "dask>=2026.1.2",
    "earthaccess>=0.16.0",
    "geopandas>=1.1.2",
    "geotiff>=0.2.10",
    "geoviews>=1.15.1",
    "h5netcdf>=1.8.1",
    "holoviews>=1.22.1",
    "netcdf4>=1.7.4",
    "numcodecs<0.16", # pin numcodecs to <0.16 due to issue with satpy resmapling with kdtree
    "numpy>=2.4.2",
    "panel>=1.8.7",
    "pyarrow>=23.0.1",
    "pycoast>=1.8.0",
    "pydecorate",
    "pyhdf>=0.11.6",
    "pykdtree>=1.4.3",
    "pyresample>=1.35.0",
    "pyspectral>=0.14.1",
    "rasterio>=1.5.0",
    "satpy>=0.59.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "tqdm>=4.67.3",
    "watchfiles>=1.1.1",
    "xarray>=2025.11.0",
    "zarr>=2.12.0",
]

[tool.uv]
required-version = ">=0.11.2"

# Three packages have no pre-built cp314 Windows wheel on PyPI and require
# Visual Studio to compile from source.  The wheels/ directory contains
# pre-built binaries so that uv sync works without a compiler on Windows.
# marker = "sys_platform == 'win32'" limits the override to Windows only;
# Linux / macOS fall through to PyPI (sdist compiles fine with gcc/clang).
# Note: find-links is intentionally NOT used here because it causes uv to
# record the wheels/ registry as the source for non-Windows platforms too,
# breaking resolution on Linux/macOS.  Explicit [tool.uv.sources] entries
# with platform markers give uv the correct per-platform resolution.
[tool.uv.sources]
pyhdf     = { path = "wheels/pyhdf-0.11.6-cp314-cp314-win_amd64.whl",     marker = "sys_platform == 'win32'" }
cartopy   = { path = "wheels/cartopy-0.25.0-cp314-cp314-win_amd64.whl",   marker = "sys_platform == 'win32'" }
numcodecs = { path = "wheels/numcodecs-0.15.1-cp314-cp314-win_amd64.whl", marker = "sys_platform == 'win32'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hvplot>=0.12.2",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.3",
    "rioxarray>=0.21.0",
    "ruff>=0.15.0",
]
